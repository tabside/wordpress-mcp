# wordpress-mcp: ein Container, SQLite (OAuth-Clients und Tokens) im Volume "data".
# Portainer: Git-Stack aus diesem Repository (Build-Methode Repository), die Werte aus
# .env.example als Stack-Umgebungsvariablen. Die Seiten samt Anwendungspasswörtern stehen
# nur in Stack-Variablen (WP_SITES oder WP_SITE_<KEY>_*), nie im Repo.
# Bei Git-Stacks schreibt Portainer keine stack.env (env_file: stack.env bricht das Deploy ab).
# Einzelvariablen pro Seite (WP_SITE_<KEY>_URL, _USER, _APP_PASSWORD, _LABEL, optional _REST_URL)
# müssen deshalb unten unter environment ohne Wert aufgeführt werden; die Werte selbst stehen
# nur in den Stack-Variablen in Portainer.
# Veröffentlicht wird nur der API-Port, TLS macht der Reverse-Proxy (NPM).
#
# cap_drop/security_opt sind bewusst nicht gesetzt: Portainer lehnt sie für Nicht-Admin-
# Benutzer ab (wie bei zammad-mcp). Der Container läuft trotzdem als uid 1000 mit
# read-only Root-Dateisystem.

services:
  wordpress-mcp:
    image: ghcr.io/tabside/wordpress-mcp:${WORDPRESS_MCP_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      GATEWAY_USERS: ${GATEWAY_USERS}
      WP_SITES: ${WP_SITES:-}
      SERVICE_NAME: ${SERVICE_NAME:-WordPress MCP}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-3600}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-2592000}
      TOOL_CALLS_PER_MINUTE: ${TOOL_CALLS_PER_MINUTE:-120}
      WP_TIMEOUT: ${WP_TIMEOUT:-60}
      MAX_FILE_MB: ${MAX_FILE_MB:-20}
      # Seiten als Einzelvariablen (Werte nur in Portainer)
      WP_SITE_LEXTERNA_URL: ${WP_SITE_LEXTERNA_URL:-}
      WP_SITE_LEXTERNA_USER: ${WP_SITE_LEXTERNA_USER:-}
      WP_SITE_LEXTERNA_APP_PASSWORD: ${WP_SITE_LEXTERNA_APP_PASSWORD:-}
      WP_SITE_LEXTERNA_LABEL: ${WP_SITE_LEXTERNA_LABEL:-}
      WP_SITE_SRFWL_URL: ${WP_SITE_SRFWL_URL:-}
      WP_SITE_SRFWL_USER: ${WP_SITE_SRFWL_USER:-}
      WP_SITE_SRFWL_APP_PASSWORD: ${WP_SITE_SRFWL_APP_PASSWORD:-}
      WP_SITE_SRFWL_LABEL: ${WP_SITE_SRFWL_LABEL:-}
      WP_SITE_AGSBAUING_URL: ${WP_SITE_AGSBAUING_URL:-}
      WP_SITE_AGSBAUING_USER: ${WP_SITE_AGSBAUING_USER:-}
      WP_SITE_AGSBAUING_APP_PASSWORD: ${WP_SITE_AGSBAUING_APP_PASSWORD:-}
      WP_SITE_AGSBAUING_LABEL: ${WP_SITE_AGSBAUING_LABEL:-}
    ports:
      - "${MCP_BIND_ADDR:-127.0.0.1}:${MCP_HOST_PORT:-8440}:8000"
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  data:
