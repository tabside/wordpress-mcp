name: Plugin-ZIP bauen

# Nach jedem erfolgreichen Testlauf eines Pushs auf main (Unit- und Integrationstests gegen echtes
# WordPress): ZIP bauen. Gibt es zur Version im Plugin-Header noch kein Release plugin-v<Version>,
# wird es mit dem ZIP angelegt. Die installierten Plugins holen es sich darüber als automatisches
# Update (includes/class-tabside-mcp-updater.php), darum erst nach grünen Tests.
# Für ein neues Update also im Plugin-Header und in TABSIDE_MCP_VERSION die Version erhöhen.

on:
  workflow_run:
    workflows: ["Test, build and publish Docker image"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

jobs:
  zip:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Version prüfen
        id: version
        run: |
          version=$(sed -n 's/^ \* Version: *\(.*\)$/\1/p' plugin/tabside-mcp/tabside-mcp.php | tr -d '[:space:]')
          constant=$(sed -n "s/^define( 'TABSIDE_MCP_VERSION', '\(.*\)' );$/\1/p" plugin/tabside-mcp/tabside-mcp.php)
          test -n "$version" && test "$version" = "$constant"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "plugin-v$version" >/dev/null 2>&1; then
            echo "Release plugin-v$version existiert bereits, es wird nur das Artefakt gebaut."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: ZIP bauen (Commit-Hash eintragen)
        run: |
          mkdir -p build
          cp -r plugin/tabside-mcp build/tabside-mcp
          sed -i "s/define( 'TABSIDE_MCP_COMMIT', 'dev' );/define( 'TABSIDE_MCP_COMMIT', '${SHA::12}' );/" build/tabside-mcp/tabside-mcp.php
          grep -q "TABSIDE_MCP_COMMIT', '${SHA::12}'" build/tabside-mcp/tabside-mcp.php
          find build/tabside-mcp -name '*.php' -print0 | xargs -0 -n1 php -l
          cd build && zip -qr "tabside-mcp-${{ steps.version.outputs.version }}.zip" tabside-mcp

      - uses: actions/upload-artifact@v4
        with:
          name: tabside-mcp-${{ steps.version.outputs.version }}
          path: build/tabside-mcp-${{ steps.version.outputs.version }}.zip

      - name: GitHub-Release anlegen
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plugin-v${{ steps.version.outputs.version }}
          target_commitish: ${{ env.SHA }}
          name: tabside-mcp ${{ steps.version.outputs.version }}
          body: "tabside-mcp ${{ steps.version.outputs.version }} (Commit ${{ env.SHA }}). Installierte Plugins holen sich dieses Release als automatisches Update."
          files: build/tabside-mcp-${{ steps.version.outputs.version }}.zip
