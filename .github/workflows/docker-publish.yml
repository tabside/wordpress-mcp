name: Test, build and publish Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt -e ".[dev]"
      - name: Lint
        run: python -m pyflakes wordpressmcp tests
      - name: Tests (WordPress is faked)
        run: python -m pytest -q

  plugin:
    # Plugin gegen echtes WordPress (SQLite) mit MCP Adapter, über das Gateway getestet.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress: ["6.9", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: sqlite3, pdo_sqlite, mbstring, zip, gd, intl
          tools: none
      - name: PHP-Syntax (auch PHP 7.4-kompatibel halten)
        run: find plugin/tabside-mcp -name '*.php' -print0 | xargs -0 -n1 php -l
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt -e ".[dev]"
      - name: WordPress aufsetzen
        run: |
          plugin/tests/setup-wordpress.sh "$RUNNER_TEMP/wp" 8871 "${{ matrix.wordpress }}" | tee "$RUNNER_TEMP/wp.txt"
          echo "WP_TEST_APP_PASSWORD=$(sed -n 's/^APP=//p' "$RUNNER_TEMP/wp.txt")" >> "$GITHUB_ENV"
          echo "WP_TEST_OTHER_APP_PASSWORD=$(sed -n 's/^OTHERAPP=//p' "$RUNNER_TEMP/wp.txt")" >> "$GITHUB_ENV"
          echo "WP_TEST_READER_APP_PASSWORD=$(sed -n 's/^READERAPP=//p' "$RUNNER_TEMP/wp.txt")" >> "$GITHUB_ENV"
          PHP_CLI_SERVER_WORKERS=4 nohup php -S 127.0.0.1:8871 -t "$RUNNER_TEMP/wp" > "$RUNNER_TEMP/php-server.log" 2>&1 &
          sleep 2
      - name: Integrationstest
        env:
          WP_TEST_URL: http://127.0.0.1:8871
        run: python -m pytest -q tests/test_integration_wordpress.py -rs
      - name: PHP-Log
        if: always()
        run: cat "$RUNNER_TEMP/wp/debug.log" 2>/dev/null || true

  build-and-push:
    needs: [test, plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          base=$(sed -n 's/^_VERSION_BASE = "\(.*\)"$/\1/p' wordpressmcp/__init__.py)
          count=$(git rev-list --count HEAD -- wordpressmcp Dockerfile pyproject.toml requirements.txt)
          test -n "$base" && test -n "$count"
          echo "version=${base}.${count}" >> "$GITHUB_OUTPUT"

      - name: Lowercase image name
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: wordpressmcp:smoke
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          echo "ein langes testpasswort" | docker run --rm -i wordpressmcp:smoke wordpressmcp hash-password | grep -Eq '^pbkdf2-sha256:600000:'
          set +e; docker run --rm wordpressmcp:smoke wordpressmcp api >/tmp/out.txt 2>&1; rc=$?; set -e
          cat /tmp/out.txt
          grep -q 'configuration error' /tmp/out.txt && test "$rc" = 2

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
