[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wordpressmcp"
description = "Remote MCP gateway (OAuth 2.1) for the tabside-mcp WordPress plugin on customer sites"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = [
    "mcp>=2.3.0,<3.0.0",
    "starlette>=0.47",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "mammoth>=1.8,<2",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "pyflakes>=3", "python-docx>=1.1"]

[project.scripts]
wordpressmcp = "wordpressmcp.cli:main"

[tool.setuptools]
packages = ["wordpressmcp", "wordpressmcp.auth"]

[tool.setuptools.dynamic]
version = { attr = "wordpressmcp._VERSION_BASE" }

[tool.pytest.ini_options]
testpaths = ["tests"]
